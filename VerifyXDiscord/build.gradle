plugins {
    id 'java'
}

group = 'io.verifyx'
version = '1.1.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }

    // ProtocolLib via JitPack
    maven { url = 'https://jitpack.io' }

    // PlaceholderAPI
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}


dependencies {

    // ===== SERVER PROVIDED =====
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'com.github.dmulloy2:ProtocolLib:4.8.0'

    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    // ===== BUNDLED INTO FAT JAR =====
    implementation 'net.dv8tion:JDA:5.0.0-beta.20'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'
    implementation 'dev.dejvokep:boosted-yaml:1.3.4'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * ===== FAT JAR CONFIG =====
 */
jar {
    archiveFileName = "VerifyXDiscord-${version}.jar"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }

    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
}

processResources {
    filesMatching('plugin.yml') {
        expand version: version
    }
}

test {
    useJUnitPlatform()
}
